version: '3.8'

services:
  camphish:
    build: .
    container_name: camphish-v2
    ports:
      - "3333:3333"
    volumes:
      - ./saved_locations:/app/saved_locations
      - ./saved_fingerprints:/app/saved_fingerprints
      - ./saved_videos:/app/saved_videos
    environment:
      - PHP_CLI_SERVER_WORKERS=4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/"]
      interval: 30s
      timeout: 5s
      retries: 3
